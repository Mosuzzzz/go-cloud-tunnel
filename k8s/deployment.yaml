apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-app-deployment
  namespace: big-project # รันในห้องที่เราเพิ่งสร้าง
spec:
  replicas: 2 # รันแอปพร้อมกัน 2 ก๊อปปี้
  selector:
    matchLabels:
      app: go-app
  template:
    metadata:
      labels:
        app: go-app
    spec:
      containers:
      - name: go-app
        image: mosuthecreator/go-app:v2 # เปลี่ยนเป็น ID ของคุณ
        ports:
        - containerPort: 8080
        env:
        - name: DB_HOST
          value: "db" # ชื่อเดียวกับ Service ของ Postgres
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_NAME
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: API_KEY
